<!DOCTYPE html>
<html>
<body style="font-family:system-ui,sans-serif;max-width:600px;margin:0 auto;padding:24px">
<h2>You've been assigned: {{ course_title }}</h2>
<p>Hello,</p>
<p>You have been enrolled on <strong>{{ course_title }}</strong>.</p>
{% if due_date %}<p>Please complete this course by <strong>{{ due_date }}</strong>.</p>{% endif %}
<p><a href="{{ course_url }}" style="display:inline-block;padding:12px 24px;background:#1f3a5f;color:#fff;text-decoration:none;border-radius:6px">Start Course</a></p>
</body>
</html>
