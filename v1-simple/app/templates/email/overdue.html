<!DOCTYPE html>
<html>
<body style="font-family:system-ui,sans-serif;max-width:600px;margin:0 auto;padding:24px">
<h2 style="color:#dc2626">Overdue: {{ course_title }}</h2>
<p><strong>{{ course_title }}</strong> was due on <strong>{{ due_date }}</strong> and has not been completed.</p>
<p><a href="{{ course_url }}" style="display:inline-block;padding:12px 24px;background:#dc2626;color:#fff;text-decoration:none;border-radius:6px">Complete Now</a></p>
</body>
</html>
