name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        run: npm install --no-save eslint@8

      - name: Lint JS files
        run: npx eslint "app/static/js/**/*.js" --env browser,es2021 --rule '{"no-undef": "warn", "no-unused-vars": "warn"}' --ignore-pattern "*.min.js"
        continue-on-error: true
