<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Course Builder</title>
    <!-- build: 2026-05-08-spa-deeplinks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --text: #1e293b;
            --font-family: 'Inter', sans-serif;
            --heading-font: 'Inter', sans-serif;
            --border-radius: 8px;
        }

        * {
            font-family: var(--font-family);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--heading-font);
        }

        .primary-bg {
            background-color: var(--primary);
        }

        .primary-text {
            color: var(--primary);
        }

        .secondary-bg {
            background-color: var(--secondary);
        }

        .accent-bg {
            background-color: var(--accent);
        }

        .custom-border-radius {
            border-radius: var(--border-radius);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: var(--border-radius);
            color: white;
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
        }

        .toast.success {
            background-color: #10b981;
        }

        .toast.error {
            background-color: #ef4444;
        }

        .toast.info {
            background-color: var(--primary);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge.success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .badge.warning {
            background-color: #fef3c7;
            color: #92400e;
        }

        .badge.danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .badge.info {
            background-color: #dbeafe;
            color: #0c4a6e;
        }

        .chart-bar {
            display: inline-block;
            background-color: var(--primary);
            border-radius: 4px;
            margin: 0 4px;
        }

        textarea.custom-textarea {
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Show errors in a fixed overlay so we don't fight React's DOM
        window.__firstError = null;
        window.onerror = function(msg, src, line, col, err) {
            if (window.__firstError) return; // only capture first error
            window.__firstError = {msg, src, line, col, stack: err ? err.stack : ''};
            var d = document.createElement('div');
            d.style = 'position:fixed;top:0;left:0;right:0;z-index:99999;padding:16px;background:#fef2f2;border-bottom:2px solid red;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:50vh;overflow:auto';
            d.innerHTML = '<strong style="color:red">JS Error:</strong> ' + msg + '\n' + src + ':' + line + '\n\n' + (err ? err.stack : '');
            document.body.appendChild(d);
        };
    </script>
    <script type="text/babel">
        const { useState, useEffect, useContext, createContext, useCallback, useRef } = React;
        const { createRoot } = ReactDOM;

        // API base URL — empty string when backend serves this file (same origin),
        // or the backend origin when deployed as a separate frontend service.
        const API_BASE = (() => {
            const h = window.location.hostname;
            if (h === 'localhost' || h === '127.0.0.1') return '';
            // Production: served at buildbench.uk/lms — Traefik strips /lms before
            // forwarding, so FastAPI always sees /api/... unchanged.
            return '/lms';
        })();

        // ============= CUSTOM ROUTER (no external dep) =============

        const BASE = '/lms';

        const RouterCtx = createContext({ path: '/', navigate: () => {} });

        const BrowserRouter = ({ children }) => {
            const getInternalPath = () => {
                const p = window.location.pathname;
                return p.startsWith(BASE) ? (p.slice(BASE.length) || '/') : p;
            };
            const [path, setPath] = useState(getInternalPath);
            useEffect(() => {
                const handler = () => setPath(getInternalPath());
                window.addEventListener('popstate', handler);
                return () => window.removeEventListener('popstate', handler);
            }, []);
            const navigate = useCallback((to) => {
                window.history.pushState(null, '', BASE + to);
                setPath(to);
            }, []);
            return React.createElement(RouterCtx.Provider, { value: { path, navigate } }, children);
        };

        const useNavigate = () => useContext(RouterCtx).navigate;
        const useLocation = () => ({ pathname: useContext(RouterCtx).path });

        // Match a route pattern against a path (supports :param wildcards)
        const matchRoute = (pattern, path) => {
            if (pattern === '*') return true;
            const pp = pattern.split('/'), lp = path.split('/');
            if (pp.length !== lp.length) return false;
            return pp.every((p, i) => p.startsWith(':') || p === lp[i]);
        };

        const Routes = ({ children }) => {
            const { path } = useContext(RouterCtx);
            const kids = React.Children.toArray(children);
            for (const kid of kids) {
                if (matchRoute(kid.props.path, path)) return kid.props.element;
            }
            return null;
        };

        const Route = () => null; // declarative only — Routes handles rendering

        const Navigate = ({ to }) => {
            const nav = useNavigate();
            useEffect(() => { nav(to); }, []);
            return null;
        };

        // ============= HELPERS =============

        // Strip markdown code fences / raw JSON from descriptions before display
        const safeDesc = (text, maxLen = 160) => {
            if (!text) return '';
            let t = text.trim();
            // Strip ```json ... ``` or ``` ... ``` blocks
            t = t.replace(/^```(?:json)?\s*/i, '').replace(/```[\s\S]*$/, '').trim();
            // If what remains looks like raw JSON, don't show it
            if (t.startsWith('{') || t.startsWith('[')) return 'Course content generated.';
            return t.length > maxLen ? t.slice(0, maxLen) + '…' : t;
        };

        // ============= CONTEXT & AUTH =============

        const AuthContext = createContext();

        const AuthProvider = ({ children }) => {
            const [auth, setAuth] = useState(null);
            const [loading, setLoading] = useState(true);
            const [user, setUser] = useState(null);

            useEffect(() => {
                const token = localStorage.getItem('token');
                if (token) {
                    setAuth(token);
                    fetchUserProfile(token).finally(() => setLoading(false));
                } else {
                    setLoading(false);
                }
            }, []);

            const fetchUserProfile = async (token) => {
                try {
                    const res = await fetch(API_BASE + '/api/auth/me', {
                        headers: { Authorization: `Bearer ${token}` },
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setUser(data);
                        return data;
                    }
                } catch (err) {
                    console.error('Failed to fetch user profile:', err);
                }
                return null;
            };

            const login = async (username, password, mfaCode = null) => {
                try {
                    const body = { username, password };
                    if (mfaCode) body.mfa_code = mfaCode;

                    const res = await fetch(API_BASE + '/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });

                    const data = await res.json();

                    if (res.ok) {
                        localStorage.setItem('token', data.access_token);
                        setAuth(data.access_token);
                        const userData = await fetchUserProfile(data.access_token);
                        return { success: true, user: userData };
                    } else if (res.status === 403 && data.detail?.includes('MFA')) {
                        return { success: false, requiresMfa: true, error: data.detail };
                    } else {
                        return { success: false, error: data.detail || 'Login failed' };
                    }
                } catch (err) {
                    return { success: false, error: err.message };
                }
            };

            const logout = () => {
                localStorage.removeItem('token');
                setAuth(null);
                setUser(null);
            };

            return (
                <AuthContext.Provider value={{ auth, loading, user, login, logout }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const useAuth = () => {
            const context = useContext(AuthContext);
            if (!context) throw new Error('useAuth must be used within AuthProvider');
            return context;
        };

        // ============= API SERVICE =============

        const api = {
            get: async (path, options = {}) => {
                const { auth } = { auth: localStorage.getItem('token') };
                const res = await fetch(`${API_BASE}/api${path}`, {
                    ...options,
                    headers: {
                        'Authorization': auth ? `Bearer ${auth}` : '',
                        'Content-Type': 'application/json',
                        ...options.headers,
                    },
                });
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.history.pushState(null, '', '/login');
                    window.dispatchEvent(new PopStateEvent('popstate'));
                }
                return res;
            },
            post: async (path, body, options = {}) => {
                const { auth } = { auth: localStorage.getItem('token') };
                const res = await fetch(`${API_BASE}/api${path}`, {
                    method: 'POST',
                    ...options,
                    headers: {
                        'Authorization': auth ? `Bearer ${auth}` : '',
                        'Content-Type': 'application/json',
                        ...options.headers,
                    },
                    body: JSON.stringify(body),
                });
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.history.pushState(null, '', '/login');
                    window.dispatchEvent(new PopStateEvent('popstate'));
                }
                return res;
            },
            put: async (path, body, options = {}) => {
                const { auth } = { auth: localStorage.getItem('token') };
                const res = await fetch(`${API_BASE}/api${path}`, {
                    method: 'PUT',
                    ...options,
                    headers: {
                        'Authorization': auth ? `Bearer ${auth}` : '',
                        'Content-Type': 'application/json',
                        ...options.headers,
                    },
                    body: JSON.stringify(body),
                });
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.history.pushState(null, '', '/login');
                    window.dispatchEvent(new PopStateEvent('popstate'));
                }
                return res;
            },
            delete: async (path, options = {}) => {
                const { auth } = { auth: localStorage.getItem('token') };
                const res = await fetch(`${API_BASE}/api${path}`, {
                    method: 'DELETE',
                    ...options,
                    headers: {
                        'Authorization': auth ? `Bearer ${auth}` : '',
                        'Content-Type': 'application/json',
                        ...options.headers,
                    },
                });
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    window.history.pushState(null, '', '/login');
                    window.dispatchEvent(new PopStateEvent('popstate'));
                }
                return res;
            },
        };

        // ============= TOAST NOTIFICATION =============

        const ToastContext = createContext();

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);

            const showToast = useCallback((message, type = 'info', duration = 3000) => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, duration);
            }, []);

            return (
                <ToastContext.Provider value={{ showToast }}>
                    {children}
                    <div>
                        {toasts.map(toast => (
                            <div key={toast.id} className={`toast ${toast.type}`}>
                                {toast.message}
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };

        const useToast = () => {
            const context = useContext(ToastContext);
            if (!context) throw new Error('useToast must be used within ToastProvider');
            return context;
        };

        // ============= REUSABLE COMPONENTS =============

        const Modal = ({ open, onClose, title, children, size = 'md' }) => {
            if (!open) return null;

            const sizeClasses = {
                sm: 'max-w-sm',
                md: 'max-w-md',
                lg: 'max-w-lg',
                xl: 'max-w-2xl',
            };

            return (
                <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 fade-in">
                    <div className={`bg-white rounded-lg shadow-xl ${sizeClasses[size]} w-full mx-4`}>
                        <div className="flex justify-between items-center p-6 border-b">
                            <h2 className="text-xl font-bold">{title}</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                ✕
                            </button>
                        </div>
                        <div className="p-6">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const Button = ({ children, variant = 'primary', size = 'md', fullWidth = false, disabled = false, ...props }) => {
            const baseClasses = 'font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2';
            const sizeClasses = {
                sm: 'px-3 py-1.5 text-sm',
                md: 'px-4 py-2 text-base',
                lg: 'px-6 py-3 text-lg',
            };
            const variantClasses = {
                primary: 'bg-blue-600 text-white hover:bg-blue-700 focus:ring-blue-500',
                secondary: 'bg-gray-200 text-gray-900 hover:bg-gray-300 focus:ring-gray-400',
                danger: 'bg-red-600 text-white hover:bg-red-700 focus:ring-red-500',
                ghost: 'text-blue-600 hover:bg-blue-50 focus:ring-blue-500',
            };

            return (
                <button
                    className={`${baseClasses} ${sizeClasses[size]} ${variantClasses[variant]} ${fullWidth ? 'w-full' : ''} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}
                    disabled={disabled}
                    {...props}
                >
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-lg shadow-sm border border-gray-200 ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, variant = 'info' }) => (
            <span className={`badge ${variant}`}>
                {children}
            </span>
        );

        const Input = ({ label, error, ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium mb-1 text-gray-700">{label}</label>}
                <input
                    {...props}
                    className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${error ? 'border-red-500' : 'border-gray-300'}`}
                />
                {error && <p className="text-red-500 text-sm mt-1">{error}</p>}
            </div>
        );

        const Select = ({ label, options, error, ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium mb-1 text-gray-700">{label}</label>}
                <select
                    {...props}
                    className={`w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${error ? 'border-red-500' : 'border-gray-300'}`}
                >
                    <option value="">-- Select --</option>
                    {options.map(opt => (
                        <option key={opt.value} value={opt.value}>
                            {opt.label}
                        </option>
                    ))}
                </select>
                {error && <p className="text-red-500 text-sm mt-1">{error}</p>}
            </div>
        );

        const Textarea = ({ label, error, ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium mb-1 text-gray-700">{label}</label>}
                <textarea
                    {...props}
                    className={`custom-textarea w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 ${error ? 'border-red-500' : 'border-gray-300'}`}
                />
                {error && <p className="text-red-500 text-sm mt-1">{error}</p>}
            </div>
        );

        const ProtectedRoute = ({ children, adminOnly = false, creatorRoute = false }) => {
            const { auth, loading, user } = useAuth();

            if (loading) {
                return <div className="flex items-center justify-center h-screen"><div className="spin text-4xl">⏳</div></div>;
            }

            if (!auth) return <Navigate to="/login" />;

            // Admin routes: trainees → /learn, creators → /creator
            if (adminOnly) {
                if (user?.role === 'trainee') return <Navigate to="/learn" />;
                if (user?.role === 'creator') return <Navigate to="/creator" />;
            }

            // Creator routes: trainees → /learn
            if (creatorRoute && user?.role === 'trainee') return <Navigate to="/learn" />;

            return children;
        };

        // ============= LEARNER PORTAL =============

        const LearnerLayout = ({ children }) => {
            const { user, logout } = useAuth();
            const navigate = useNavigate();

            const handleLogout = () => {
                logout();
                navigate('/login');
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Top navbar */}
                    <nav className="bg-white border-b border-gray-200 sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-14">
                                <span
                                    className="text-lg font-bold text-gray-900 cursor-pointer"
                                    onClick={() => navigate('/learn')}
                                >
                                    LMS Course Builder
                                </span>
                                <div className="flex items-center gap-4">
                                    <span className="text-sm text-gray-500">{user?.username}</span>
                                    <button
                                        onClick={handleLogout}
                                        className="text-sm text-gray-600 hover:text-gray-900 px-3 py-1 rounded border border-gray-300 hover:border-gray-400 transition-colors"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {children}
                    </main>
                </div>
            );
        };

        const LearnerCatalogue = () => {
            const [courses, setCourses] = useState([]);
            const [total, setTotal] = useState(0);
            const [page, setPage] = useState(1);
            const [search, setSearch] = useState('');
            const [searchInput, setSearchInput] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const navigate = useNavigate();

            useEffect(() => {
                const timer = setTimeout(() => setSearch(searchInput), 300);
                return () => clearTimeout(timer);
            }, [searchInput]);

            useEffect(() => {
                setPage(1);
                setCourses([]);
            }, [search]);

            useEffect(() => {
                fetchCourses(page, search, page === 1);
            }, [page, search]);

            const fetchCourses = async (p, q, replace) => {
                setLoading(true);
                setError('');
                try {
                    const params = new URLSearchParams({ page: p, page_size: 20 });
                    if (q) params.append('q', q);
                    const res = await api.get(`/learn/courses?${params}`);
                    if (!res.ok) throw new Error('Failed to load courses');
                    const data = await res.json();
                    setTotal(data.total);
                    setCourses(prev => replace ? data.items : [...prev, ...data.items]);
                } catch (err) {
                    setError('Could not load courses. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const SkeletonCard = () => (
                <div className="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden animate-pulse">
                    <div className="h-32 bg-gray-200" />
                    <div className="p-4 space-y-2">
                        <div className="h-4 bg-gray-200 rounded w-3/4" />
                        <div className="h-3 bg-gray-200 rounded w-full" />
                        <div className="h-3 bg-gray-200 rounded w-2/3" />
                    </div>
                </div>
            );

            return (
                <div>
                    <h1 className="text-2xl font-bold text-gray-900 mb-6">All Courses</h1>

                    {/* Search */}
                    <div className="mb-8">
                        <input
                            type="text"
                            placeholder="Search courses..."
                            value={searchInput}
                            onChange={e => setSearchInput(e.target.value)}
                            className="w-full max-w-xl px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                        />
                    </div>

                    {/* Error */}
                    {error && (
                        <div className="text-center py-12">
                            <p className="text-red-500 mb-4">{error}</p>
                            <button
                                onClick={() => fetchCourses(1, search, true)}
                                className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm"
                            >
                                Try again
                            </button>
                        </div>
                    )}

                    {/* Course grid */}
                    {!error && (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {courses.map(course => (
                                <div
                                    key={course.id}
                                    onClick={() => navigate(`/learn/${course.id}`)}
                                    className="bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow duration-200 cursor-pointer overflow-hidden border border-gray-100"
                                >
                                    <div className="h-32 bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
                                        <span className="text-white text-4xl">📚</span>
                                    </div>
                                    <div className="p-4">
                                        <h3 className="font-bold text-gray-900 text-sm mb-1 overflow-hidden" style={{display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>
                                            {course.title}
                                        </h3>
                                        <p className="text-gray-500 text-xs mb-3 overflow-hidden" style={{display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>
                                            {safeDesc(course.description, 100)}
                                        </p>
                                        <div className="flex items-center justify-between">
                                            {course.has_content ? (
                                                <span className="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full font-medium">
                                                    Content Ready
                                                </span>
                                            ) : <span />}
                                            <span className="text-gray-400 text-xs">
                                                {new Date(course.created_at).toLocaleDateString()}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            ))}

                            {/* Skeleton cards while loading */}
                            {loading && [1,2,3].map(n => <SkeletonCard key={n} />)}
                        </div>
                    )}

                    {/* Empty state */}
                    {!loading && !error && courses.length === 0 && (
                        <div className="text-center py-24">
                            <div className="text-6xl mb-4">📭</div>
                            <p className="text-gray-500 text-lg">No courses available yet.</p>
                        </div>
                    )}

                    {/* Load more */}
                    {!loading && !error && courses.length < total && (
                        <div className="text-center mt-10">
                            <button
                                onClick={() => setPage(p => p + 1)}

                setNotFound(false);

        const LoginPage = () => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [mfaCode, setMfaCode] = useState('');
            const [requiresMfa, setRequiresMfa] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [brandConfig, setBrandConfig] = useState({ brand_name: 'LMS Course Builder' });
            const navigate = useNavigate();
            const { login } = useAuth();
            const { showToast } = useToast();

            useEffect(() => {
                fetchBrandConfig();
            }, []);

            const fetchBrandConfig = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/whitelabel/preview');
                    if (res.ok) {
                        const data = await res.json();
                        setBrandConfig(data);
                        applyTheme(data);
                    }
                } catch (err) {
                    console.error('Failed to fetch brand config:', err);
                }
            };

            const applyTheme = (config) => {
                if (config.primary_color) document.documentElement.style.setProperty('--primary', config.primary_color);
                if (config.secondary_color) document.documentElement.style.setProperty('--secondary', config.secondary_color);
                if (config.accent_color) document.documentElement.style.setProperty('--accent', config.accent_color);
                if (config.bg_color) document.documentElement.style.setProperty('--bg', config.bg_color);
                if (config.text_color) document.documentElement.style.setProperty('--text', config.text_color);
                if (config.font_family) document.documentElement.style.setProperty('--font-family', config.font_family);
                if (config.heading_font) document.documentElement.style.setProperty('--heading-font', config.heading_font);
                if (config.border_radius) document.documentElement.style.setProperty('--border-radius', `${config.border_radius}px`);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                const result = await login(username, password, requiresMfa ? mfaCode : null);

                if (result.success) {
                    showToast('Login successful!', 'success');
                    const dest = result.user?.role === 'trainee' ? '/learn' : result.user?.role === 'creator' ? '/creator' : '/admin';
                    navigate(dest);
                } else if (result.requiresMfa) {
                    setRequiresMfa(true);
                    setPassword('');
                    setError('');
                } else {
                    setError(result.error);
                    showToast(result.error, 'error');
                }

                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: 'var(--bg)' }}>
                    <Card className="w-full max-w-md">
                        <div className="p-8">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold mb-2" style={{ color: 'var(--text)' }}>
                                    {brandConfig.brand_name}
                                </h1>
                                <p className="text-gray-600">Admin Portal</p>
                            </div>

                            <form onSubmit={handleLogin}>
                                {!requiresMfa ? (
                                    <>
                                        <Input
                                            type="text"
                                            label="Username"
                                            placeholder="Enter your username"
                                            value={username}
                                            onChange={(e) => setUsername(e.target.value)}
                                            required
                                        />
                                        <Input
                                            type="password"
                                            label="Password"
                                            placeholder="Enter your password"
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            required
                                        />
                                    </>
                                ) : (
                                    <Input
                                        type="text"
                                        label="MFA Code"
                                        placeholder="Enter 6-digit code"
                                        value={mfaCode}
                                        onChange={(e) => setMfaCode(e.target.value.replace(/\D/g, '').slice(0, 6))}
                                        maxLength="6"
                                        required
                                    />
                                )}

                                {error && (
                                    <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
                                        {error}
                                    </div>
                                )}

                                <Button
                                    type="submit"
                                    fullWidth
                                    disabled={loading}
                                >
                                    {loading ? '⏳ Processing...' : (requiresMfa ? 'Verify MFA' : 'Sign In')}
                                </Button>

                                {requiresMfa && (
                                    <Button
                                        type="button"
                                        variant="ghost"
                                        fullWidth
                                        onClick={() => {
                                            setRequiresMfa(false);
                                            setMfaCode('');
                                            setPassword('');
                                        }}
                                        className="mt-2"
                                    >
                                        Back to Login
                                    </Button>
                                )}
                            </form>
                        </div>
                    </Card>
                </div>
            );
        };

                    {/* Main Content */}

        const AdminDashboard = () => {
