        const UserManagementPage = () => {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState('');
            const [roleFilter, setRoleFilter] = useState('');
            const [page, setPage] = useState(1);
            const [modalOpen, setModalOpen] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [formData, setFormData] = useState({ username: '', email: '', password: '', role: 'trainee' });
            const [totalUsers, setTotalUsers] = useState(0);
            const [formError, setFormError] = useState('');
            const { showToast } = useToast();

            const pageSize = 10;

            useEffect(() => {
                fetchUsers();
            }, [page, search, roleFilter]);

            const fetchUsers = async () => {
                setLoading(true);
                try {
                    const params = new URLSearchParams({
                        skip: (page - 1) * pageSize,
                        limit: pageSize,
                    });
                    if (search) params.append('search', search);
                    if (roleFilter) params.append('role', roleFilter);

                    const res = await api.get(`/users?${params}`);
                    if (res.ok) {
                        const data = await res.json();
                        setUsers(Array.isArray(data) ? data : data.items || []);
                        if (data.total !== undefined) setTotalUsers(data.total);
                    }
                } catch (err) {
                    console.error('Failed to fetch users:', err);
                    showToast('Failed to load users', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleSaveUser = async () => {
                setFormError('');
                if (!formData.username || !formData.email || (!editingUser && !formData.password)) {
                    setFormError('Please fill all required fields');
                    return;
                }

                try {
                    const endpoint = editingUser ? `/users/${editingUser.id}` : '/users';
                    const method = editingUser ? 'put' : 'post';
                    const res = await api[method](endpoint, formData);

                    if (res.ok) {
                        showToast(editingUser ? 'User updated' : 'User created', 'success');
                        setModalOpen(false);
                        setEditingUser(null);
                        setFormData({ username: '', email: '', password: '', role: 'trainee' });
                        fetchUsers();
                    } else {
                        const err = await res.json();
                        const detail = err.detail;
                        setFormError(
                            Array.isArray(detail)
                                ? detail.map(e => e.msg || JSON.stringify(e)).join('; ')
                                : detail || 'Failed to save user'
                        );
                    }
                } catch (err) {
                    setFormError(err.message);
                }
            };

            const handleDeleteUser = async (userId) => {
                if (confirm('Are you sure? This cannot be undone.')) {
                    try {
                        const res = await api.delete(`/users/${userId}`);
                        if (res.ok) {
                            showToast('User deleted', 'success');
                            fetchUsers();
                        } else {
                            showToast('Failed to delete user', 'error');
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            };

            const handleEditUser = (user) => {
                setEditingUser(user);
                setFormData({ username: user.username, email: user.email, password: '', role: user.role });
                setModalOpen(true);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <div className="flex gap-4 flex-1">
                            <input
                                type="text"
                                placeholder="Search users..."
                                value={search}
                                onChange={(e) => {
                                    setSearch(e.target.value);
                                    setPage(1);
                                }}
                                className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                            <select
                                value={roleFilter}
                                onChange={(e) => {
                                    setRoleFilter(e.target.value);
                                    setPage(1);
                                }}
                                className="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <option value="">All Roles</option>
                                <option value="admin">Admin</option>
                                <option value="creator">Creator</option>
                                <option value="trainee">Trainee</option>
                            </select>
                        </div>
                        <Button onClick={() => {
                            setEditingUser(null);
                            setFormData({ username: '', email: '', password: '', role: 'trainee' });
                            setModalOpen(true);
                        }}>
                            ➕ New User
                        </Button>
                    </div>

                    {loading ? (
                        <div className="text-center py-12"><div className="spin text-4xl inline-block">⏳</div></div>
                    ) : (
                        <Card className="overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead className="bg-gray-50 border-b">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-sm font-semibold">Name</th>
                                            <th className="px-6 py-3 text-left text-sm font-semibold">Email</th>
                                            <th className="px-6 py-3 text-left text-sm font-semibold">Role</th>
                                            <th className="px-6 py-3 text-left text-sm font-semibold">Status</th>
                                            <th className="px-6 py-3 text-left text-sm font-semibold">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {users.map(user => (
                                            <tr key={user.id} className="hover:bg-gray-50">
                                                <td className="px-6 py-4 font-medium">{user.username}</td>
                                                <td className="px-6 py-4 text-gray-600">{user.email}</td>
                                                <td className="px-6 py-4">
                                                    <Badge variant={user.role === 'admin' ? 'danger' : 'info'}>
                                                        {user.role}
                                                    </Badge>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <Badge variant={user.is_active ? 'success' : 'warning'}>
                                                        {user.is_active ? 'Active' : 'Inactive'}
                                                    </Badge>
                                                </td>
                                                <td className="px-6 py-4 text-sm space-x-2">
                                                    <button onClick={() => handleEditUser(user)} className="text-blue-600 hover:underline">
                                                        Edit
                                                    </button>
                                                    <button onClick={() => handleDeleteUser(user.id)} className="text-red-600 hover:underline">
                                                        Delete
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="px-6 py-4 border-t flex justify-between items-center">
                                <p className="text-sm text-gray-600">Page {page}</p>
                                <div className="space-x-2">
                                    <Button variant="secondary" size="sm" onClick={() => setPage(Math.max(1, page - 1))}>
                                        ← Prev
                                    </Button>
                                    <Button variant="secondary" size="sm" onClick={() => setPage(page + 1)}>
                                        Next →
                                    </Button>
                                </div>
                            </div>
                        </Card>
                    )}

                    <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editingUser ? 'Edit User' : 'Create User'}>
                        <div className="space-y-4">
                            <Input
                                label="Username"
                                value={formData.username}
                                onChange={(e) => setFormData({ ...formData, username: e.target.value })}
                                disabled={!!editingUser}
                            />
                            <Input
                                label="Email"
                                type="email"
                                value={formData.email}
                                onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                            />
                            {!editingUser && (
                                <Input
                                    label="Password"
                                    type="password"
                                    value={formData.password}
                                    onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                                />
                            )}
                            <Select
                                label="Role"
                                value={formData.role}
                                onChange={(e) => setFormData({ ...formData, role: e.target.value })}
                                options={[
                                    { value: 'trainee', label: 'Trainee' },
                                    { value: 'creator', label: 'Creator' },
                                    { value: 'admin', label: 'Admin' },
                                ]}
                            />
                            {formError && (
                                <div className="p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
                                    {formError}
                                </div>
                            )}
                            <div className="flex gap-2 justify-end">
                                <Button variant="secondary" onClick={() => setModalOpen(false)}>
                                    Cancel
                                </Button>
                                <Button onClick={handleSaveUser}>
                                    Save
                                </Button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        const CourseManagementPage = () => {
            const [courses, setCourses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [modalOpen, setModalOpen] = useState(false);
            const [aiModalOpen, setAiModalOpen] = useState(false);
            const [formData, setFormData] = useState({ title: '', description: '' });
            const [aiData, setAiData] = useState({ topic: '', num_modules: 5, difficulty: 'intermediate', additional_instructions: '' });
            const [formError, setFormError] = useState('');
            const [aiMode, setAiMode] = useState('document');
            const [uploadedFile, setUploadedFile] = useState(null);
            const [docDifficulty, setDocDifficulty] = useState('intermediate');
            const [docInstructions, setDocInstructions] = useState('');
            const [generating, setGenerating] = useState(false);
            const [wizardStep, setWizardStep] = useState(1);
            const [wizardParams, setWizardParams] = useState({
                videos_per_module: 1,
                video_duration: 'medium',
                tone: 'formal',
                target_audience: 'general',
                include_assessment: true,
            });
            const fileInputRef = useRef(null);
            const { showToast } = useToast();

            useEffect(() => {
                fetchCourses();
            }, []);

            const fetchCourses = async () => {
                setLoading(true);
                try {
                    const res = await api.get('/courses');
                    if (res.ok) {
                        const d = await res.json();
                        setCourses(Array.isArray(d) ? d : d.items || []);
                    }
                } catch (err) {
                    showToast('Failed to load courses', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleCreateCourse = async () => {
                setFormError('');
                if (!formData.title || !formData.description) {
                    setFormError('Please fill all fields');
                    return;
                }

                try {
                    const res = await api.post('/courses', formData);
                    if (res.ok) {
                        showToast('Course created', 'success');
                        setModalOpen(false);
                        setFormData({ title: '', description: '' });
                        fetchCourses();
                    } else {
                        const err = await res.json();
                        setFormError(err.detail || 'Failed to create course');
                    }
                } catch (err) {
                    setFormError(err.message);
                }
            };

            const handleGenerateCourse = async () => {
                setFormError('');

                if (wizardStep === 1) {
                    if (aiMode === 'document' && !uploadedFile) {
                        setFormError('Please select a file');
                        return;
                    }
                    if (aiMode === 'topic' && !aiData.topic) {
                        setFormError('Please enter a topic');
                        return;
                    }
                    setWizardStep(2);
                    return;
                }

                setGenerating(true);

                try {
                    if (aiMode === 'document') {
                        const formData = new FormData();
                        formData.append('file', uploadedFile);
                        formData.append('difficulty', docDifficulty);
                        if (docInstructions) formData.append('additional_instructions', docInstructions);
                        formData.append('videos_per_module', wizardParams.videos_per_module);
                        formData.append('video_duration', wizardParams.video_duration);
                        formData.append('tone', wizardParams.tone);
                        formData.append('target_audience', wizardParams.target_audience);
                        formData.append('include_assessment', wizardParams.include_assessment);

                        const res = await fetch(`${API_BASE}/api/courses/generate-from-document`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                            body: formData
                        });

                        if (res.ok) {
                            showToast('Course generated from document!', 'success');
                            setAiModalOpen(false);
                            setUploadedFile(null);
                            setDocDifficulty('intermediate');
                            setDocInstructions('');
                            setWizardStep(1);
                            setWizardParams({
                                videos_per_module: 1,
                                video_duration: 'medium',
                                tone: 'formal',
                                target_audience: 'general',
                                include_assessment: true,
                            });
                            fetchCourses();
                        } else {
                            const err = await res.json();
                            setFormError(err.detail || 'Failed to generate course from document');
                        }
                    } else {
                        const res = await api.post('/courses/generate', { ...aiData, ...wizardParams });
                        if (res.ok) {
                            showToast('Course generated! Check your courses list.', 'success');
                            setAiModalOpen(false);
                            setAiData({ topic: '', num_modules: 5, difficulty: 'intermediate', additional_instructions: '' });
                            setWizardStep(1);
                            setWizardParams({
                                videos_per_module: 1,
                                video_duration: 'medium',
                                tone: 'formal',
                                target_audience: 'general',
                                include_assessment: true,
                            });
                            fetchCourses();
                        } else {
                            const err = await res.json();
                            setFormError(err.detail || 'Failed to generate course');
                        }
                    }
                } catch (err) {
                    setFormError(err.message);
                } finally {
                    setGenerating(false);
                }
            };

            const handlePublish = async (courseId) => {
                try {
                    const res = await api.put(`/courses/${courseId}`, { status: 'published' });
                    if (res.ok) {
                        showToast('Course published', 'success');
                        fetchCourses();
                    } else {
                        showToast('Failed to publish course', 'error');
                    }
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };

            const handleDelete = async (courseId) => {
                if (confirm('Are you sure you want to delete this course?')) {
                    try {
                        const res = await api.delete(`/courses/${courseId}`);
                        if (res.ok) {
                            showToast('Course deleted', 'success');
                            fetchCourses();
                        } else {
                            showToast('Failed to delete course', 'error');
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            };

            const handleDownload = async (courseId, type, courseTitle) => {
                try {
                    const endpoint = type === 'script' ? 'generate-script' : 'generate-slides';
                    const ext = type === 'script' ? 'docx' : 'pptx';
                    const res = await fetch(`${API_BASE}/api/courses/${courseId}/${endpoint}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    });
                    if (!res.ok) {
                        showToast(`Failed to generate ${type}`, 'error');
                        return;
                    }
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${courseTitle}_${type}.${ext}`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast(`${type === 'script' ? 'Script' : 'Slides'} downloaded!`, 'success');
                } catch (err) {
                    showToast(`Error: ${err.message}`, 'error');
                }
            };

            const handleGenerateVoiceover = async (courseId, courseTitle) => {
                showToast('Generating voiceover — this may take a minute...', 'success');
                try {
                    const res = await fetch(`${API_BASE}/api/courses/${courseId}/generate-voiceover`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    });
                    if (res.ok) {
                        showToast('Voiceover generated!', 'success');
                    } else {
                        const err = await res.json();
                        showToast(err.detail || 'Voiceover generation failed', 'error');
                    }
                } catch (err) {
                    showToast(`Error: ${err.message}`, 'error');
                }
            };

            const handleViewPlayer = (courseId) => {
                window.open(`http://127.0.0.1:7000/api/courses/${courseId}/player`, '_blank');
            };

            return (
                <div className="space-y-6">
                    <div className="flex gap-4">
                        <Button onClick={() => setModalOpen(true)}>
                            📚 New Course
                        </Button>
                        <Button variant="secondary" onClick={() => setAiModalOpen(true)}>
                            ✨ Generate with AI
                        </Button>
                    </div>

                    {loading ? (
                        <div className="text-center py-12"><div className="spin text-4xl inline-block">⏳</div></div>
                    ) : courses.length === 0 ? (
                        <Card className="p-12 text-center">
                            <p className="text-gray-600 text-lg">No courses yet. Create one to get started!</p>
                        </Card>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {courses.map(course => (
                                <Card key={course.id} className="p-6 flex flex-col h-full">
                                    <div className="flex-1">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-bold text-lg flex-1">{course.title}</h3>
                                            <Badge variant={course.status === 'published' ? 'success' : 'warning'}>
                                                {course.status}
                                            </Badge>
                                        </div>
                                        <p className="text-gray-600 text-sm mb-3">{safeDesc(course.description)}</p>
                                        <div className="text-xs text-gray-500 space-y-1">
                                            <p>Creator: {course.creator_id}</p>
                                            <p>Created: {new Date(course.created_at).toLocaleDateString()}</p>
                                            <p>Enrollments: {course.enrollment_count || 0}</p>
                                        </div>
                                    </div>
                                    <div className="mt-4 pt-4 border-t space-y-2">
                                        {course.status !== 'published' && (
                                            <Button size="sm" fullWidth onClick={() => handlePublish(course.id)}>
                                                Publish
                                            </Button>
                                        )}
                                        {(course.has_content || course.content) && (
                                            <>
                                                <Button size="sm" variant="secondary" fullWidth onClick={() => handleDownload(course.id, 'script', course.title)}>
                                                    📝 Script
                                                </Button>
                                                <Button size="sm" variant="secondary" fullWidth onClick={() => handleDownload(course.id, 'slides', course.title)}>
                                                    📊 Slides
                                                </Button>
                                                <Button size="sm" variant="secondary" fullWidth onClick={() => handleGenerateVoiceover(course.id, course.title)}>
                                                    🎙️ Voiceover
                                                </Button>
                                                <Button size="sm" variant="secondary" fullWidth onClick={() => handleViewPlayer(course.id)}>
                                                    🎬 View Course
                                                </Button>
                                            </>
                                        )}
                                        <Button size="sm" variant="danger" fullWidth onClick={() => handleDelete(course.id)}>
                                            Delete
                                        </Button>
                                    </div>
                                </Card>
                            ))}
                        </div>
                    )}

                    <Modal open={modalOpen} onClose={() => setModalOpen(false)} title="Create Course">
                        <div className="space-y-4">
                            <Input
                                label="Title"
                                value={formData.title}
                                onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                placeholder="Course title"
                            />
                            <Textarea
                                label="Description"
                                value={formData.description}
                                onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                placeholder="Course description"
                                rows={4}
                            />
                            {formError && (
                                <div className="p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
                                    {formError}
                                </div>
                            )}
                            <div className="flex gap-2 justify-end">
                                <Button variant="secondary" onClick={() => setModalOpen(false)}>
                                    Cancel
                                </Button>
                                <Button onClick={handleCreateCourse}>
                                    Create
                                </Button>
                            </div>
                        </div>
                    </Modal>

                    <Modal open={aiModalOpen} onClose={() => {
                        setAiModalOpen(false);
                        setWizardStep(1);
                        setWizardParams({
                            videos_per_module: 1,
                            video_duration: 'medium',
                            tone: 'formal',
                            target_audience: 'general',
                            include_assessment: true,
                        });
                    }} title={wizardStep === 1 ? "Generate Course with AI" : "Customise Your Course"}>
                        <div className="space-y-4">
                            {wizardStep === 2 && (
                                <button
                                    onClick={() => setWizardStep(1)}
                                    className="text-gray-500 hover:text-gray-700 text-sm font-medium mb-4"
                                >
                                    ← Back
                                </button>
                            )}
                            {wizardStep === 1 && (
                                <>
                                    {/* Tab Toggle */}
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setAiMode('document')}
                                            className={`px-4 py-2 rounded font-medium transition-colors ${
                                                aiMode === 'document'
                                                    ? 'bg-blue-500 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}
                                        >
                                            From Document
                                        </button>
                                        <button
                                            onClick={() => setAiMode('topic')}
                                            className={`px-4 py-2 rounded font-medium transition-colors ${
                                                aiMode === 'topic'
                                                    ? 'bg-blue-500 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}
                                        >
                                            From Topic
                                        </button>
                                    </div>
                                </>
                            )}

                            {wizardStep === 1 && (
                                <>
                                    {/* From Document Tab */}
                                    {aiMode === 'document' && (
                                        <>
                                    {/* File Upload Zone */}
                                    <div
                                        onDragOver={(e) => {
                                            e.preventDefault();
                                            e.currentTarget.classList.add('border-blue-400');
                                        }}
                                        onDragLeave={(e) => {
                                            e.currentTarget.classList.remove('border-blue-400');
                                        }}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            e.currentTarget.classList.remove('border-blue-400');
                                            const files = e.dataTransfer.files;
                                            if (files.length > 0) {
                                                const file = files[0];
                                                const validTypes = ['.docx', '.pptx', '.pdf'];
                                                const isValid = validTypes.some(type => file.name.toLowerCase().endsWith(type));
                                                if (isValid && file.size <= 10 * 1024 * 1024) {
                                                    setUploadedFile(file);
                                                } else {
                                                    setFormError('Invalid file. Please upload .docx, .pptx, or .pdf (max 10MB)');
                                                }
                                            }
                                        }}
                                        onClick={() => fileInputRef.current?.click()}
                                        className={`border-2 border-dashed rounded-lg p-8 text-center cursor-pointer transition-colors ${
                                            uploadedFile
                                                ? 'border-green-400 bg-green-50'
                                                : 'border-gray-300 hover:border-blue-400'
                                        }`}
                                    >
                                        <input
                                            ref={fileInputRef}
                                            type="file"
                                            accept=".docx,.pptx,.pdf"
                                            onChange={(e) => {
                                                const file = e.target.files?.[0];
                                                if (file) {
                                                    const validTypes = ['.docx', '.pptx', '.pdf'];
                                                    const isValid = validTypes.some(type => file.name.toLowerCase().endsWith(type));
                                                    if (isValid && file.size <= 10 * 1024 * 1024) {
                                                        setUploadedFile(file);
                                                        setFormError('');
                                                    } else {
                                                        setFormError('Invalid file. Please upload .docx, .pptx, or .pdf (max 10MB)');
                                                    }
                                                }
                                            }}
                                            style={{ display: 'none' }}
                                        />
                                        {uploadedFile ? (
                                            <div className="space-y-2">
                                                <p className="text-green-700 font-medium">✓ {uploadedFile.name}</p>
                                                <button
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        setUploadedFile(null);
                                                    }}
                                                    className="inline-block text-gray-500 hover:text-gray-700 text-lg"
                                                >
                                                    ×
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="space-y-2">
                                                <p className="font-medium text-gray-800">Drop your document here or click to browse</p>
                                                <p className="text-sm text-gray-600">Supports .docx, .pptx, .pdf — max 10MB</p>
                                            </div>
                                        )}
                                    </div>

                                    <Select
                                        label="Difficulty Level"
                                        value={docDifficulty}
                                        onChange={(e) => setDocDifficulty(e.target.value)}
                                        options={[
                                            { value: 'beginner', label: 'Beginner' },
                                            { value: 'intermediate', label: 'Intermediate' },
                                            { value: 'advanced', label: 'Advanced' },
                                        ]}
                                    />

                                    <Textarea
                                        label="Additional Instructions"
                                        value={docInstructions}
                                        onChange={(e) => setDocInstructions(e.target.value)}
                                        placeholder="Any specific topics or focus areas? (optional)"
                                        rows={3}
                                    />
                                </>
                            )}

                                    {/* From Topic Tab */}
                                    {aiMode === 'topic' && (
                                        <>
                                            <Input
                                                label="Topic"
                                                value={aiData.topic}
                                                onChange={(e) => setAiData({ ...aiData, topic: e.target.value })}
                                                placeholder="e.g., 'Advanced JavaScript Patterns'"
                                            />
                                            <Input
                                                label="Number of Modules"
                                                type="number"
                                                value={aiData.num_modules}
                                                onChange={(e) => setAiData({ ...aiData, num_modules: parseInt(e.target.value) })}
                                                min={1}
                                                max={20}
                                            />
                                            <Select
                                                label="Difficulty Level"
                                                value={aiData.difficulty}
                                                onChange={(e) => setAiData({ ...aiData, difficulty: e.target.value })}
                                                options={[
                                                    { value: 'beginner', label: 'Beginner' },
                                                    { value: 'intermediate', label: 'Intermediate' },
                                                    { value: 'advanced', label: 'Advanced' },
                                                ]}
                                            />
                                            <Textarea
                                                label="Additional Instructions"
                                                value={aiData.additional_instructions}
                                                onChange={(e) => setAiData({ ...aiData, additional_instructions: e.target.value })}
                                                placeholder="Any specific topics or focus areas?"
                                                rows={3}
                                            />
                                        </>
                                    )}
                                </>
                            )}

                            {wizardStep === 2 && (
                                <>
                                    <div className="text-xs text-gray-500 mb-4">Step 2 of 2</div>
                                    <Input
                                        label="Videos per module"
                                        type="number"
                                        value={wizardParams.videos_per_module}
                                        onChange={(e) => setWizardParams({ ...wizardParams, videos_per_module: parseInt(e.target.value) })}
                                        min={1}
                                        max={5}
                                    />
                                    <Select
                                        label="Video duration"
                                        value={wizardParams.video_duration}
                                        onChange={(e) => setWizardParams({ ...wizardParams, video_duration: e.target.value })}
                                        options={[
                                            { value: 'short', label: 'Short (3-5 min)' },
                                            { value: 'medium', label: 'Medium (10-15 min)' },
                                            { value: 'long', label: 'Long (20-30 min)' },
                                        ]}
                                    />
                                    <Select
                                        label="Tone"
                                        value={wizardParams.tone}
                                        onChange={(e) => setWizardParams({ ...wizardParams, tone: e.target.value })}
                                        options={[
                                            { value: 'formal', label: 'Formal & Educational' },
                                            { value: 'conversational', label: 'Conversational' },
                                            { value: 'technical', label: 'Technical' },
                                        ]}
                                    />
                                    <Select
                                        label="Target audience"
                                        value={wizardParams.target_audience}
                                        onChange={(e) => setWizardParams({ ...wizardParams, target_audience: e.target.value })}
                                        options={[
                                            { value: 'new_starters', label: 'New Starters' },
                                            { value: 'experienced_staff', label: 'Experienced Staff' },
                                            { value: 'management', label: 'Management' },
                                            { value: 'general', label: 'General' },
                                        ]}
                                    />
                                    <div className="flex items-center gap-3">
                                        <input
                                            type="checkbox"
                                            id="include-assessment"
                                            checked={wizardParams.include_assessment}
                                            onChange={(e) => setWizardParams({ ...wizardParams, include_assessment: e.target.checked })}
                                            className="w-4 h-4"
                                        />
                                        <label htmlFor="include-assessment" className="text-sm font-medium">
                                            Include end-of-course assessment?
                                        </label>
                                    </div>
                                </>
                            )}

                            {formError && (
                                <div className="p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
                                    {formError}
                                </div>
                            )}

                            <div className="flex gap-2 justify-end">
                                <Button variant="secondary" onClick={() => setAiModalOpen(false)} disabled={generating}>
                                    Cancel
                                </Button>
                                <Button onClick={handleGenerateCourse} disabled={generating}>
                                    {wizardStep === 1 ? (
                                        'Next →'
                                    ) : generating ? (
                                        <span className="flex items-center gap-2">
                                            <span className="inline-block spin">⏳</span>
                                            Generating...
                                        </span>
                                    ) : (
                                        'Generate Course'
                                    )}
                                </Button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        const SecurityPage = () => {
            const [activeTab, setActiveTab] = useState('sessions');
            const [sessions, setSessions] = useState([]);
            const [loginAttempts, setLoginAttempts] = useState([]);
            const [auditLog, setAuditLog] = useState([]);
            const [ipAllowlist, setIpAllowlist] = useState([]);
            const [stats, setStats] = useState({ activeSessions: 0, failedLogins24h: 0, lockedAccounts: 0 });
            const [loading, setLoading] = useState(true);
            const [newIp, setNewIp] = useState('');
            const { showToast } = useToast();

            useEffect(() => {
                fetchSecurityData();
            }, [activeTab]);

            const fetchSecurityData = async () => {
                setLoading(true);
                try {
                    const [statsRes, sessionsRes, attemptsRes, auditRes, ipRes] = await Promise.all([
                        api.get('/security/dashboard'),
                        api.get('/security/sessions'),
                        api.get('/security/login-attempts'),
                        api.get('/admin/audit-log?limit=50'),
                        api.get('/security/ip-allowlist'),
                    ]);

                    if (statsRes.ok) {
                        const sd = await statsRes.json();
                        setStats({
                            activeSessions: sd.active_sessions ?? 0,
                            failedLogins24h: sd.failed_logins_24h ?? 0,
                            lockedAccounts: sd.locked_accounts ?? 0,
                        });
                    }
                    if (sessionsRes.ok) { const d = await sessionsRes.json(); setSessions(Array.isArray(d) ? d : d.items || []); }
                    if (attemptsRes.ok) { const d = await attemptsRes.json(); setLoginAttempts(Array.isArray(d) ? d : d.items || []); }
                    if (auditRes.ok) { const d = await auditRes.json(); setAuditLog(Array.isArray(d) ? d : d.items || []); }
                    if (ipRes.ok) { const d = await ipRes.json(); setIpAllowlist(Array.isArray(d) ? d : d.items || []); }
                } catch (err) {
                    showToast('Failed to load security data', 'error');
                } finally {

            useEffect(() => {

            const fetchDevData = async () => {
                setLoading(true);
                try {
                    const [healthRes, errorsRes, usageRes, flagsRes, envRes] = await Promise.all([
                        api.get('/dev/health'),
                        api.get('/dev/errors?limit=20'),
                        api.get('/dev/api-usage?limit=20'),
                        api.get('/dev/feature-flags'),
                        api.get('/dev/env-info'),
                    ]);

                    if (healthRes.ok) {
                        const h = await healthRes.json();
                        setSysHealth({
                            uptime: h.uptime_seconds ?? h.uptime ?? 0,
                            memory: h.memory_percent ?? h.memory ?? 0,
                            dbSize: (h.database_size_mb ?? 0) * 1024 * 1024,
                            apiCalls: h.api_calls ?? h.apiCalls ?? 0,
                            cpu: h.cpu_percent ?? 0,
                        });
                    }
                    if (errorsRes.ok) { const d = await errorsRes.json(); setErrors(Array.isArray(d) ? d : d.items || []); }
                    if (usageRes.ok) { const d = await usageRes.json(); setApiUsage(Array.isArray(d) ? d : d.items || []); }
                    if (flagsRes.ok) { const d = await flagsRes.json(); setFlags(Array.isArray(d) ? d : d.items || []); }
                    if (envRes.ok) setEnvInfo(await envRes.json());

                    showToast('Failed to load dev data', 'error');

                    setLoading(false);

                                            value={config.bg_color}
                                            onChange={(e) => setConfig({ ...config, bg_color: e.target.value })}
                                            className="flex-1 px-2 py-1 border rounded text-sm"
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Text Color</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="color"
                                            value={config.text_color}
                                            onChange={(e) => setConfig({ ...config, text_color: e.target.value })}
                                            className="w-12 h-10 rounded cursor-pointer"
                                        />
                                        <input
                                            type="text"
                                            value={config.text_color}
                                            onChange={(e) => setConfig({ ...config, text_color: e.target.value })}
                                            className="flex-1 px-2 py-1 border rounded text-sm"
                                        />
                                    </div>
                                </div>
                            </div>
                        </Card>

                        <Card className="p-6">
                            <h3 className="text-lg font-bold mb-4">Typography & Layout</h3>
                            <Select
                                label="Font Family"
                                value={config.font_family}
                                onChange={(e) => setConfig({ ...config, font_family: e.target.value })}
                                options={[
                                    { value: 'Inter', label: 'Inter' },
                                    { value: 'Roboto', label: 'Roboto' },
                                    { value: 'Open Sans', label: 'Open Sans' },
                                    { value: 'Lato', label: 'Lato' },
                                    { value: 'Poppins', label: 'Poppins' },
                                    { value: 'Montserrat', label: 'Montserrat' },
                                    { value: 'system-ui', label: 'System UI' },
                                ]}
                            />
                            <Select
                                label="Heading Font"
                                value={config.heading_font}
                                onChange={(e) => setConfig({ ...config, heading_font: e.target.value })}
                                options={[
                                    { value: 'Inter', label: 'Inter' },
                                    { value: 'Roboto', label: 'Roboto' },
                                    { value: 'Open Sans', label: 'Open Sans' },
                                    { value: 'Lato', label: 'Lato' },
                                    { value: 'Poppins', label: 'Poppins' },
                                    { value: 'Montserrat', label: 'Montserrat' },
                                    { value: 'system-ui', label: 'System UI' },
                                ]}
                            />
                            <div className="mb-4">
                                <label className="block text-sm font-medium mb-2">Border Radius: {config.border_radius}px</label>
                                <input
                                    type="range"
                                    min="0"
                                    max="24"
                                    value={config.border_radius}
                                    onChange={(e) => setConfig({ ...config, border_radius: parseInt(e.target.value) })}
                                    className="w-full"
                                />
                            </div>
                        </Card>

                        <Card className="p-6">
                            <h3 className="text-lg font-bold mb-4">Custom CSS</h3>
                            <Textarea
                                value={config.custom_css}
                                onChange={(e) => setConfig({ ...config, custom_css: e.target.value })}
                                placeholder="Enter custom CSS here..."
                                rows={6}
                            />
                        </Card>

                        <div className="flex gap-2">
                            <Button onClick={handleSave} disabled={saving} className="flex-1">
                                {saving ? '💾 Saving...' : '💾 Save Configuration'}
                            </Button>
                            <Button variant="secondary" onClick={handleReset} className="flex-1">
                                🔄 Reset
                            </Button>
                            <Button variant="ghost" onClick={handleExportTheme} className="flex-1">
                                ⬇️ Export
                            </Button>
                        </div>
                    </div>

                    <div className="lg:col-span-1">
                        <Card className="p-6 sticky top-6">
                            <h3 className="text-lg font-bold mb-4">Preview</h3>
                            <div
                                className="space-y-3 p-4 rounded-lg"
                                style={{
                                    backgroundColor: config.bg_color,
                                    color: config.text_color,
                                    fontFamily: config.font_family + ', sans-serif',
                                    borderRadius: config.border_radius + 'px',
                                }}
                            >
                                <div>
                                    <h2
                                        className="text-lg font-bold mb-2"
                                        style={{
                                            fontFamily: config.heading_font + ', sans-serif',
                                            color: config.primary_color,
                                        }}
                                    >
                                        {config.brand_name}
                                    </h2>
                                </div>

                                {config.logo_url && (
                                    <img src={config.logo_url} alt="Logo" className="w-full max-h-20 object-contain mb-2" />
                                )}

                                <div className="space-y-2">
                                    <button
                                        className="w-full py-2 rounded-lg font-medium text-white transition"
                                        style={{
                                            backgroundColor: config.primary_color,
                                            borderRadius: config.border_radius + 'px',
                                        }}
                                    >
                                        Primary Button
                                    </button>
                                    <button
                                        className="w-full py-2 rounded-lg font-medium text-white transition"
                                        style={{
                                            backgroundColor: config.secondary_color,
                                            borderRadius: config.border_radius + 'px',
                                        }}
                                    >
                                        Secondary Button
                                    </button>
                                    <button
                                        className="w-full py-2 rounded-lg font-medium text-white transition"
                                        style={{
                                            backgroundColor: config.accent_color,
                                            borderRadius: config.border_radius + 'px',
                                        }}
                                    >
                                        Accent Button
                                    </button>
                                </div>

                                <div className="pt-3 border-t" style={{ borderColor: config.text_color + '33' }}>
                                    <p className="text-xs opacity-75">
                                        This is a preview of your theme. Colors and fonts are applied in real-time.
                                    </p>
                                </div>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        const CourseViewerPage = () => {
            const { pathname } = useLocation();
            const courseId = pathname.split('/').pop();
            const navigate = useNavigate();

            return (
                <div className="min-h-screen flex flex-col bg-gray-900">
                    <div className="bg-gray-800 px-6 py-3 flex items-center justify-between flex-shrink-0">
                        <button
                            onClick={() => window.history.back()}
                            className="text-gray-300 hover:text-white text-sm flex items-center gap-1"
                        >
                            ← Back
                        </button>
                        <span className="text-gray-400 text-xs">Course Player</span>
                    </div>
                    <iframe
                        src={`${API_BASE}/api/courses/${courseId}/player`}
                        className="flex-1 w-full border-0"
                        style={{ minHeight: 'calc(100vh - 52px)' }}
                        title="Course Player"
                        allowFullScreen
                    />
                </div>
            );
        };

        // ============= MAIN APP =============

        const App = () => {
            return (
                <BrowserRouter>
                    <Routes>
                        <Route path="/login" element={<LoginPage />} />
                        <Route
                            path="/admin"
                            element={
                                <ProtectedRoute adminOnly={true}>
                                    <AdminLayout>
                                        <AdminDashboard />
                                    </AdminLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/admin/users"
                            element={
                                <ProtectedRoute adminOnly={true}>
                                    <AdminLayout>
                                        <UserManagementPage />
                                    </AdminLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/admin/courses"
                            element={
                                <ProtectedRoute adminOnly={true}>
                                    <AdminLayout>
                                        <CourseManagementPage />
                                    </AdminLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/admin/security"
                            element={
                                <ProtectedRoute adminOnly={true}>
                                    <AdminLayout>
                                        <SecurityPage />
                                    </AdminLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/admin/dev-tools"
                            element={
                                <ProtectedRoute adminOnly={true}>
                                    <AdminLayout>
                                        <DevToolsPage />
                                    </AdminLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/admin/whitelabel"
                            element={
                                <ProtectedRoute adminOnly={true}>
                                    <AdminLayout>
                                        <WhiteLabelPage />
                                    </AdminLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/courses/:id"
                            element={
                                <ProtectedRoute>
                                    <CourseViewerPage />
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/learn"
                            element={
                                <ProtectedRoute>
                                    <LearnerLayout>
                                        <LearnerCatalogue />
                                    </LearnerLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route
                            path="/learn/:id"
                            element={
                                <ProtectedRoute>
                                    <LearnerLayout>
                                        <CourseDetail />
                                    </LearnerLayout>
                                </ProtectedRoute>
                            }
                        />
                        <Route path="/" element={<SmartRedirect />} />
                        <Route path="*" element={<SmartRedirect />} />
                    </Routes>
                </BrowserRouter>
            );
        };

        // ============= RENDER =============

        const root = createRoot(document.getElementById('app'));
        root.render(
            <ToastProvider>
                <AuthProvider>
                    <App />
                </AuthProvider>
            </ToastProvider>
        );
    </script>
</body>
</html>
